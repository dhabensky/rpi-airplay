# Exact package=version pins for every package customize-root.sh's apt-get
# install pulls in -- the 7 named top-level packages (avahi-daemon, ffmpeg,
# gdb, libavahi-compat-libdnssd1, libplist-2.0-4, tcpdump, openssh-server)
# PLUS their full transitive dependency closure (229 total). Without this,
# apt-get resolves "whatever's currently newest in trixie" for every
# unpinned package on every build -- pinning only the 7 top-level names
# still leaves ~220 transitive deps free to drift. Regenerate by deleting
# this file, clearing the rpi-airplay-apt-cache Docker volume, running a
# build (apt will install current versions again), then re-running the
# generation one-liner in this repo's history (parses `ls
# /var/cache/apt/archives/*.deb` inside the apt-cache volume into
# name=version pairs, decoding the %3a-encoded ':' epoch separator).
# Captured 2026-09-09 against a fresh trixie apt-get update.
