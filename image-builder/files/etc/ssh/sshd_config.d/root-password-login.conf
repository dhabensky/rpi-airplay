# Debian's OpenSSH ships PermitRootLogin=prohibit-password (root can only
# log in with a key, never a password) -- this project has only ever used
# root/password auth, and getty@tty1 is masked on this image, so without
# this override there is no way in at all. Learned the hard way: an image
# built without it locked the live Pi out entirely until the file was
# written into the card's ext4 offline via `debugfs -w`.
PermitRootLogin yes
PasswordAuthentication yes
