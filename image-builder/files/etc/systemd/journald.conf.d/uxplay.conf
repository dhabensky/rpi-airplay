[Journal]
# uxplay.service logs here, so the journal is the only record of a boot
# sequence or a session: it has to survive the reboot that follows a bug,
# and it must not silently drop lines from a chatty `uxplay -d` run.
Storage=persistent
RateLimitIntervalSec=0
# /var/log is on the SD card (see customize-root.sh), so cap the journal
# instead of letting it grow to journald's default 10% of the card.
SystemMaxUse=200M
