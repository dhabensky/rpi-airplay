[Unit]
# sshd-keygen.service (which generates the host keys sshd needs to bind at
# all) ships with ConditionFirstBoot=yes, true only on the kernel boot where
# /etc/machine-id is still empty. DietPi's first boot resizes the filesystem
# and reboots before this unit ever runs, and by the second boot systemd has
# persisted a real machine-id -- so the condition is false forever, host keys
# never appear and sshd can never bind (confirmed on a freshly flashed
# image). Trigger on the keys' absence instead of on a one-shot boot flag.
ConditionFirstBoot=
ConditionPathExists=!/etc/ssh/ssh_host_rsa_key
